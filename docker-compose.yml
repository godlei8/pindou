services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: pindou
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: pindou
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pindou"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://pindou:${POSTGRES_PASSWORD}@db:5432/pindou
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      DATA_DIR: /data
      PROVIDERS_FILE: /app/providers.yaml
      ARK_API_KEY: ${ARK_API_KEY:-}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
    volumes:
      - appdata:/data
      - ./backend/providers.yaml:/app/providers.yaml:ro
    ports:
      - "8000:8000"

  web:
    image: nginx:alpine
    depends_on: [api]
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"

volumes:
  pgdata:
  appdata:
